<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <style>
        input:invalid{
            border: 2px dashed red;
        }
        input:valid{
            border: 2px solid rgb(13, 0, 255);
        }


    </style>
</head>
<body>
    <form>
        <label for="choose">Você prefere banana ou cereja?</label>
        <input type="text" id="choose" name="i_like" required pattern="banana|cherry" />
        <button>Enviar</button>
    </form>
    
</body>
</html>
