<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html RoadMap</title>
    <style>
        pre{
            white-space: pre-warp;
        }
        #exciting{
            background: linear-gradient(to bottom, #ffe8d4, #c97418);
            border: 1px solid dimgray;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 2px 2px 1px black;
        }
        .warning{
            border: 10px ridge red;
            background-color: yellow;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
        }
        .warning img {
            width: 100%;
        }
        .warning p {
            font: small-caps bold 1.2rem sans-serif;
            text-align: center;
        }
    </style>
</head>
<body>
    <pre>
        <p>ums texto que esta sendo preservado com seus espaços </p>
    </pre>
    <p id="exciting" >alerta vermelho opa pera ai laranja.</p>

    <div class="warning">
        <img src="../../../img/leopard.jpg" alt="an intimidating leopard">
        <p>Beware of the leopard</p>

    </div>
    
</body>
</html>
