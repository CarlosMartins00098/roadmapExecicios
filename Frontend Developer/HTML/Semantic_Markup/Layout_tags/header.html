<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>header</title>
    <style>
        .logo {
            background: left / cover url("../../../../img/leopard.jpg");
            display: flex;
            height: 250px;
            align-items: center;
            justify-content: center;
            font:
                bold calc(1em + 2 * (190vw - 120px) / 100) "Dancing Script",
                fantasy;
            color: #ff0083;
            text-shadow: #000 2px 2px 0.2rem;
        }
    
        header>h1 {
            margin-bottom: 0;
        }
    
        header>time {
            font: italic 0.7rem sans-serif;
        }
    </style>
</head>
<body>
    <p>
        O elemento HTML <header> representa um grupo de suporte introdutório ou navegacional. 
        Pode conter alguns elementos de cabeçalho mas também outros elementos como um logo,
         seções de cabeçalho, formulário de pesquisa, e outros.
    </p>
    <p> <a href="https://developer.mozilla.org/pt-BR/docs/Web/HTML/Reference/Elements/header">link de referencia</a></p>

    <header>
        <a class="logo" href="#">Cute Puppies Express!</a>
    </header>
    
    <article>
        <header>
            <h1>Onçinha</h1>
            <time>2026.07.25</time>
        </header>
        <p>
            gatin fofin ;)
        </p>
    </article>

</body>
</html>
