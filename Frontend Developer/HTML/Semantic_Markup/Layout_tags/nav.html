<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nav</title>
</head>
<body>
    <a href="https://developer.mozilla.org/pt-BR/docs/Web/HTML/Reference/Elements/nav">link de referencia</a>
    <p>O Elemento HTML de Navegação (&lt;nav&gt;) representa uma seção de uma página que 
    aponta para outras páginas ou para outras áreas da página, ou seja, uma seção com
     links de navegação.</p>

     <h1>Exemplos</h1>
    <nav>
        <ul>
            <li><a href="#">Página inicial</a></li>
            <li><a href="#">Sobre</a></li>
            <li><a href="#">Contato</a></li>
        </ul>
    </nav>
</body>
</html>
