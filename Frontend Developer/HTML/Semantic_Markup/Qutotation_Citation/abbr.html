<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>abbr</title>
</head>
<body>
    <p>
        A tag abbr em HTML representa uma abreviatura ou sigla. 
        É útil para fornecer uma descrição completa do termo abreviado quando o usuário 
        passa por cima dele, melhorando a acessibilidade e a clareza. 
        O atributo title é usado para especificar a forma expandida da abreviação.
    </p>

    <p> isto é <abbr title="hypertext Markup Language">HTML</abbr></p>
</body>
</html>
