<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blockquote</title>
</head>
<body>

    <p>
        O elemento &lt;blockquote&gt; em HTML representa um trecho citado por outra fonte.
        Ele é usado para longa citação, visualmente visto pelo recuo. a URL para a fonte da
        citação pode ser utilizado o cite.
    </p>

    <h3>Exemplo da mozilla </h3>

    <blockquote cite="http://developer.mozilla.org" >
        <p>Este é um Exemplo do Exemplo tirado da Mozilla Developer Center</p>
    </blockquote>

</body>
</html>
