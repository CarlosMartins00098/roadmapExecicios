<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>q</title>
</head>
<body>

    <p>
        o &lt;q&gt; é uma citação curta de um parágrafo, e os navegadores renderizam como aspas em torno do conteúdo
    </p>


    <h3>Exemplo</h3>

    <p>
        de acordo com o site da Mozilla,
        <q cite="https://www.mozilla.org/pt-BR/about/history/details/"
            >Firefox 1.0 foi lançada em 2004 e foi um grande sucesso.</q>
    </p>

</body>
</html>
