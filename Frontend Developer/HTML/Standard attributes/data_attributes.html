<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data_attributes</title>
    <style>
        article::before{
            content: attr(data-parent);
        }
        article[data-columns="3"]{
            width: 400px;
        }
        article[data-columns="4"]{
            width: 600px;
        }

        .callout{
            margin: 0.5em 0;
            padding: 0.5em;
            border-radius: 4px;
            border-width: 2px;
            border-style: solid;
        }
        .callout:not([data-variant]){
            border-color: rgb(15, 15, 15);
            background-color: rgb(15, 15, 15 / 0.2);
        }
        .callout[data-variant="note"]{
            border-color: rgb(15, 15, 235);
            background-color: rgb(15, 15, 235 / 0.2);
        }
        .callout[data-variant="warning"]{
            border-color: rgb(235, 15, 15);
            background-color: rgb(235, 15, 15 / 0.2);
        }
    </style>
</head>
<body>
    <main>
        <article 
        id="electric-cars"
        data-columns="3"
        data-index-number="12314"
        data-parent="cars">
        <!-- Electric car content -->
        </article>

        <article
        id="solar-cars"
        data-columns="3"
        data-index-number="12315"
        data-parent="cars">
        <!-- Solar car content-->
        </article>

        <article
        id="flying-cars"
        data-columns="4"
        data-index-number="12316"
        data-parent="cars">
        <!-- Flying car content-->
        </article>
    </main>

    <div class="callout">texte</div>
    <div class="callout" data-variant="note">texte</div>
    <div class="callout" data-variant="warning" >texte</div>

    <script>
    const article = document.querySelector("#electric-cars");
    article.dataset.columns;
    article.dataset.indexNumber;
    article.dataset.parent;

    // Find all elements with a data-columns attribute
    const articles = document.querySelectorAll("[data-columns]");

    // Find all elements with a data-columns="3"
    const threeColumnArticles = document.querySelectorAll('[data-columns="3"]');

    // You can then iterate over the results
    threeColumnArticles.forEach(() => {
        console.log(article.dataset.indexNumber);
    });

    </script>
</body>

</html>
