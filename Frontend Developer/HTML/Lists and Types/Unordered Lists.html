<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered Lists</title>
</head>
<body>


    <!--
    Unordered Lists in HTML

    Unordered lists are a fundamental component of HTML, used to group a set of related items where
    the specific order of the content does not strictly matter. By utilizing the <ul> element in combination with <li> elements,
    developers can create semantic structures that inform browsers and screen readers that a collection of items belongs together. 
    This semantic approach is essential for both accessibility and search engine optimization, as it provides a clear hierarchical 
    relationship between the container list and its individual components.

    Basic Syntax

    An unordered list is defined by the <ul> tag, which acts as the wrapper for the entire collection. Each individual item within
    that collection must be enclosed within an <li> (list item) tag. Browsers typically render these items with a bullet point character by default.

-->
    <ul>
        <li>First item</li>
        <li>Second item</li>
        <li>Third item</li>
    </ul>

    <!--

Structural Rules

To maintain valid HTML and ensure your pages are accessible, you must adhere to a few strict structural rules when implementing unordered lists:

1.Only <li> elements: The <ul> element should only contain <li> elements as its direct children. Placing text or other elements directly inside a <ul> without an <li> wrapper is invalid.
2.Nesting: You can nest an unordered list inside an <li> element to create sub-lists. This is useful for creating hierarchical menus or complex outlines.
3.Independence: Unordered lists should be used for grouping, not for visual styling. Avoid using <ul> solely to indent content; CSS properties like margin or padding are more appropriate for spacing.


Styling with CSS
By default, most browsers apply a list-style-type of disc. However, you have significant control over the appearance of your lists through CSS. 
You can modify the bullet points or remove them entirely to create navigation bars or clean, modern layouts.

-->
    /* Remove bullet points */
    ul {
    list-style-type: none;
    }

    /* Change bullet style */
    ul.custom {
    list-style-type: square;
    }
    <!--
Best Practices for Accessibility

Because unordered lists are heavily relied upon by screen readers to navigate content, following accessibility guidelines is critical:

1.Use Semantic Tags: Never attempt to create a list using simple paragraphs or line breaks. Screen readers will not recognize these as lists.
2.Meaningful Content: Ensure the list items contain distinct, relevant information.
3.Avoid Over-nesting: While nesting is supported, excessive nesting (more than 3 levels deep) can become confusing for users with cognitive impairments or those using assistive technology.
4.CSS for Presentation: If you need to change the style of the list, do it via external stylesheets rather than inline styles to keep the document clean.
5.Grouping: Use lists to represent logical associations, such as navigation menus, search results, or checklists.

Common Use Cases
Understanding when to use an unordered list helps keep your codebase professional and intuitive. Common scenarios include:

1.Navigation Menus: The most common use for <ul> in modern web development is building site headers and footers.
2.Feature Lists: Highlighting a product’s features or services.
3.Sidebar Links: Organizing related articles or categories on a blog.
4.Breadcrumbs: Providing navigational pathways for users.
5.Icon Lists: Displaying items with specific custom icons handled via the list-style-image property or background images.

-->


</body>
</html>
